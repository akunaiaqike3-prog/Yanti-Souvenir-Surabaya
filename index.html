<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yanti Souvenir Surabaya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Jost:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Ikon & tampilan seperti aplikasi (PWA) -->
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#AE2A66">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Yanti Souvenir">
<!-- Firebase (realtime database) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --fuschia:#AE2A66;
    --fuschia-deep:#7C1C49;
    --fuschia-tint:#F5DCE7;
    --fuschia-tint-2:#FBEEF4;
    --champagne:#F1E5CD;
    --champagne-deep:#DFC79C;
    --champagne-pale:#FAF5E9;
    --white:#FFFFFF;
    --grey:#5B564F;
    --grey-soft:#8B8578;
    --grey-line:#E6E0D2;
    --grey-dark:#332F2A;
    --ok:#4C7A54;
    --warn:#B4762B;
    --danger:#A5323A;
    --shadow: 0 1px 2px rgba(51,47,42,.06), 0 6px 20px rgba(51,47,42,.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Jost',sans-serif;
    background:var(--champagne-pale);
    color:var(--grey-dark);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4,.serif{font-family:'Cormorant Garamond',serif;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  a{color:inherit;}
  ::selection{background:var(--fuschia-tint);}

  /* ---------- layout shells ---------- */
  .screen{min-height:100vh;display:flex;flex-direction:column;}
  .hide{display:none !important;}

  /* ---------- landing ---------- */
  .landing{
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(circle at 15% 20%, var(--fuschia-tint-2) 0%, transparent 45%),
      radial-gradient(circle at 85% 85%, var(--champagne) 0%, transparent 50%),
      var(--champagne-pale);
    padding:32px 20px;
  }
  .landing-card{
    max-width:560px;width:100%;
    text-align:center;
  }
  .brand-mark{
    width:120px;height:120px;margin:0 auto 18px;
    display:flex;align-items:center;justify-content:center;
  }
  .brand-mark img{width:100%;height:100%;object-fit:contain;}
  .landing h1{
    font-size:42px;font-weight:600;margin:0 0 4px;letter-spacing:.3px;color:var(--grey-dark);
  }
  .landing .tag{
    color:var(--fuschia);font-size:15px;letter-spacing:2px;margin-bottom:8px;
  }
  .landing p.desc{
    color:var(--grey-soft);font-size:16px;line-height:1.6;max-width:420px;margin:14px auto 36px;
  }
  .landing-choices{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;}
  .choice-card{
    background:var(--white);border:1px solid var(--grey-line);
    border-radius:14px;padding:26px 24px;width:220px;
    box-shadow:var(--shadow);
    transition:transform .15s ease, box-shadow .15s ease;
    text-align:left;
  }
  .choice-card:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(51,47,42,.1);}
  .choice-card .icon{font-size:26px;margin-bottom:10px;display:block;}
  .choice-card h3{margin:0 0 6px;font-size:22px;font-weight:600;}
  .choice-card p{margin:0 0 16px;font-size:13.5px;color:var(--grey-soft);line-height:1.5;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    border:none;border-radius:9px;padding:10px 18px;font-size:14.5px;font-weight:500;
    transition:filter .15s ease, background .15s ease;
  }
  .btn-fuschia{background:var(--fuschia);color:var(--white);}
  .btn-fuschia:hover{filter:brightness(1.08);}
  .btn-outline{background:transparent;border:1px solid var(--grey-line);color:var(--grey-dark);}
  .btn-outline:hover{border-color:var(--fuschia);color:var(--fuschia);}
  .btn-block{width:100%;}
  .btn-sm{padding:6px 12px;font-size:13px;border-radius:7px;}
  .btn-ghost{background:transparent;border:none;color:var(--grey-soft);}
  .btn-ghost:hover{color:var(--fuschia);}
  .btn-danger-outline{background:transparent;border:1px solid var(--danger);color:var(--danger);}
  .btn-danger-outline:hover{background:var(--danger);color:var(--white);}

  /* ---------- admin login ---------- */
  .login-box{
    max-width:360px;width:100%;background:var(--white);border:1px solid var(--grey-line);
    border-radius:14px;padding:30px 28px;box-shadow:var(--shadow);text-align:left;
  }
  .login-box label{font-size:13px;color:var(--grey-soft);display:block;margin-bottom:6px;}
  .field{margin-bottom:16px;}
  .field input, .field select, .field textarea{
    width:100%;padding:10px 12px;border:1px solid var(--grey-line);border-radius:8px;
    font-size:14.5px;color:var(--grey-dark);background:var(--white);
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:none;border-color:var(--fuschia);box-shadow:0 0 0 3px var(--fuschia-tint);
  }
  .err-msg{color:var(--danger);font-size:13px;margin-top:8px;min-height:16px;}

  /* ---------- client app ---------- */
  .client-header{
    background:linear-gradient(120deg,var(--fuschia-deep),var(--fuschia) 60%, #C24B85);
    color:var(--champagne-pale);
    padding:36px 24px 48px;
    position:relative;
  }
  .client-header .back{
    position:fixed;top:18px;left:18px;z-index:60;color:var(--grey-dark);font-size:13px;font-weight:500;
    display:flex;align-items:center;gap:4px;cursor:pointer;
    background:rgba(255,255,255,.92);padding:8px 16px;border-radius:999px;box-shadow:var(--shadow);
    transition:background .15s ease, transform .15s ease;
  }
  .client-header .back:hover{background:var(--white);transform:translateY(-1px);}
  .client-header-inner{max-width:960px;margin:0 auto;text-align:center;}
  .client-header .tag{font-size:13px;letter-spacing:2px;opacity:.85;margin-bottom:6px;}
  .client-header h1{font-size:36px;margin:0 0 8px;font-weight:600;}
  .client-header p{opacity:.9;font-size:15px;max-width:520px;margin:0 auto;}
  .client-logo{
    width:86px;height:86px;
    display:flex;align-items:center;justify-content:center;margin:0 auto 12px;
  }
  .client-logo img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 4px 10px rgba(0,0,0,.2));}
  .contact-card{
    background:var(--white);border:1px solid var(--grey-line);border-radius:14px;box-shadow:var(--shadow);
    padding:18px 20px;margin-top:26px;display:flex;gap:22px;flex-wrap:wrap;
  }
  .contact-item{display:flex;align-items:center;gap:10px;font-size:13.8px;color:var(--grey-dark);}
  .contact-item .ic{
    width:34px;height:34px;border-radius:50%;background:var(--fuschia-tint);color:var(--fuschia-deep);
    display:flex;align-items:center;justify-content:center;font-size:15px;flex:none;
  }
  .contact-item .k{font-size:11px;color:var(--grey-soft);display:block;}
  .client-body{max-width:1080px;margin:-28px auto 60px;padding:0 20px;width:100%;position:relative;z-index:2;}
  .search-bar{
    background:var(--white);border-radius:14px;box-shadow:var(--shadow);
    padding:14px 18px;display:flex;gap:10px;align-items:center;margin-bottom:22px;
    border:1px solid var(--grey-line);
  }
  .search-bar input{border:none;outline:none;flex:1;font-size:15px;background:transparent;}
  .cat-tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:22px;}
  .cat-tab{
    white-space:nowrap;padding:9px 16px;border-radius:999px;border:1px solid var(--grey-line);
    background:var(--white);font-size:13.5px;color:var(--grey);flex:none;
  }
  .cat-tab:hover{border-color:var(--fuschia);color:var(--fuschia);}
  .cat-tab.active{background:var(--fuschia);border-color:var(--fuschia);color:var(--white);}
  .cat-tab.active:hover{color:var(--white);}
  .product-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px;
  }
  .product-card{
    background:var(--white);border:1px solid var(--grey-line);border-radius:16px;overflow:hidden;
    box-shadow:var(--shadow);display:flex;flex-direction:column;
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .product-card:hover{transform:translateY(-5px);box-shadow:0 16px 32px rgba(51,47,42,.14);border-color:var(--fuschia-tint);}
  .product-thumb{
    position:relative;height:168px;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--fuschia-tint),var(--champagne));
    font-family:'Cormorant Garamond',serif;font-size:46px;color:var(--fuschia-deep);font-weight:600;
    overflow:hidden;
  }
  .product-thumb img{width:100%;height:100%;object-fit:cover;transition:transform .3s ease;}
  .product-card:hover .product-thumb img{transform:scale(1.06);}
  .product-cat-badge{
    position:absolute;top:10px;left:10px;background:rgba(255,255,255,.92);color:var(--fuschia-deep);
    font-size:10.5px;padding:4px 11px;border-radius:999px;font-weight:600;letter-spacing:.3px;
    box-shadow:0 2px 6px rgba(0,0,0,.08);
  }
  .product-info{padding:16px 17px 18px;flex:1;display:flex;flex-direction:column;}
  .product-name{font-size:19px;font-weight:600;margin:0 0 6px;font-family:'Cormorant Garamond',serif;line-height:1.2;}
  .product-desc{font-size:13px;color:var(--grey-soft);line-height:1.5;flex:1;margin-bottom:10px;}
  .addon-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
  .addon-chip{background:var(--fuschia-tint);color:var(--fuschia-deep);font-size:10.8px;padding:3px 10px;border-radius:999px;font-weight:500;}
  .product-price{font-size:16px;font-weight:600;color:var(--fuschia-deep);padding-top:10px;border-top:1px dashed var(--grey-line);}
  .empty-state{
    text-align:center;padding:60px 20px;color:var(--grey-soft);
  }
  .empty-state .icon{font-size:36px;display:block;margin-bottom:10px;}

  /* ---------- admin shell ---------- */
  .admin-shell{display:flex;min-height:100vh;}
  .sidebar{
    width:230px;flex:none;background:var(--champagne);border-right:1px solid var(--champagne-deep);
    padding:22px 16px;display:flex;flex-direction:column;
  }
  .sidebar-brand{display:flex;align-items:center;gap:10px;margin-bottom:26px;padding:0 6px;}
  .sidebar-brand .mark{
    width:44px;height:44px;
    display:flex;align-items:center;justify-content:center;flex:none;
  }
  .sidebar-brand .mark img{width:100%;height:100%;object-fit:contain;}
  .sidebar-brand div.txt{line-height:1.2;flex:1;min-width:0;}
  .sidebar-brand .name{font-size:15px;font-weight:600;font-family:'Cormorant Garamond',serif;}
  .sidebar-brand .role{font-size:11px;color:var(--grey-soft);}
  .nav-item{
    display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;
    font-size:14px;color:var(--grey-dark);margin-bottom:2px;border:none;background:transparent;width:100%;text-align:left;
  }
  .nav-item .ic{font-size:16px;width:20px;text-align:center;}
  .nav-item:hover{background:rgba(174,42,102,.08);}
  .nav-item.active{background:var(--fuschia);color:var(--white);}
  .sidebar-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--champagne-deep);}
  .main{flex:1;min-width:0;padding:28px 34px 60px;overflow-x:hidden;}
  .main.no-sidebar{padding-top:82px;}
  @media (max-width:640px){
    .main.no-sidebar{padding-top:78px;padding-left:20px;padding-right:20px;}
  }
  .menu-toggle{
    position:fixed;top:16px;left:16px;z-index:70;
    width:42px;height:42px;border-radius:10px;border:1px solid var(--grey-line);
    background:var(--white);box-shadow:var(--shadow);font-size:18px;color:var(--grey-dark);
    display:flex;align-items:center;justify-content:center;
  }
  .menu-toggle:hover{border-color:var(--fuschia);color:var(--fuschia);}
  .mobile-topbar{display:none;}
  .sidebar-backdrop{display:none;}
  .sidebar-close-btn{
    margin-left:auto;border:none;background:transparent;color:var(--grey-soft);
    font-size:16px;padding:6px;border-radius:7px;flex:none;
  }
  .sidebar-close-btn:hover{background:rgba(174,42,102,.1);color:var(--fuschia-deep);}
  .main-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:10px;}
  .main-head h2{font-size:28px;margin:0;font-weight:600;}
  .main-head p{margin:2px 0 0;color:var(--grey-soft);font-size:13.5px;}

  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:26px;}
  .stat-card{
    background:var(--white);border:1px solid var(--grey-line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);
  }
  .stat-card .n{font-size:30px;font-weight:600;font-family:'Cormorant Garamond',serif;color:var(--fuschia-deep);}
  .stat-card .l{font-size:12.5px;color:var(--grey-soft);margin-top:2px;}

  .panel{background:var(--white);border:1px solid var(--grey-line);border-radius:14px;box-shadow:var(--shadow);padding:22px 24px;margin-bottom:22px;}
  .panel h3{margin:0 0 16px;font-size:18px;font-weight:600;}
  .row{display:flex;gap:14px;flex-wrap:wrap;}
  .row > .field{flex:1;min-width:160px;}

  table{width:100%;border-collapse:collapse;font-size:13.8px;}
  th{
    text-align:left;font-weight:500;color:var(--grey-soft);font-size:12px;letter-spacing:.3px;
    padding:8px 10px;border-bottom:1px solid var(--grey-line);
  }
  td{padding:10px 10px;border-bottom:1px solid var(--grey-line);vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  .table-wrap{overflow-x:auto;}
  .pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:500;}
  .pill-baru{background:#EAF0FB;color:#3A5FA0;}
  .pill-diproses{background:#FBF1DE;color:var(--warn);}
  .pill-selesai{background:#E7F2E8;color:var(--ok);}
  .pill-batal{background:#F7E6E7;color:var(--danger);}
  .icon-btn{border:none;background:transparent;color:var(--grey-soft);font-size:14px;padding:4px 6px;border-radius:6px;}
  .icon-btn:hover{background:var(--fuschia-tint);color:var(--fuschia-deep);}
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px;flex-wrap:wrap;}

  .order-item-row{display:flex;gap:10px;align-items:flex-end;margin-bottom:10px;flex-wrap:wrap;background:var(--champagne-pale);padding:10px;border-radius:10px;border:1px solid var(--grey-line);}
  .order-item-row .field{margin-bottom:0;}
  .bonus-check{display:flex;align-items:flex-start;gap:11px;padding:11px 13px;margin-bottom:8px;
    border:1px solid var(--grey-line);border-radius:10px;background:var(--white);transition:border-color .15s ease, background .15s ease;}
  .bonus-check:hover{border-color:var(--fuschia-tint);background:var(--fuschia-tint-2);}
  .bonus-check:last-child{margin-bottom:0;}
  .bonus-check input[type="checkbox"]{width:17px !important;height:17px;flex:none;margin:2px 0 0;accent-color:var(--fuschia);}
  .bonus-check > div{flex:1;min-width:0;}
  .bonus-check .b-name{font-weight:500;font-size:14.5px;line-height:1.3;}
  .bonus-check .b-desc{font-size:12.5px;color:var(--grey-soft);line-height:1.45;margin-top:2px;}
  .addon-price-field{max-width:240px;margin:-2px 0 12px 41px;}
  .added-items-table{margin-top:6px;}
  .total-line{display:flex;justify-content:space-between;padding:10px 0;font-size:15px;}
  .total-line.grand{font-weight:600;font-size:18px;border-top:1px solid var(--grey-line);margin-top:6px;color:var(--fuschia-deep);}

  .modal-backdrop{
    position:fixed;inset:0;background:rgba(51,47,42,.45);display:flex;align-items:center;justify-content:center;
    padding:20px;z-index:50;
  }
  .modal{
    background:var(--white);border-radius:14px;max-width:560px;width:100%;max-height:86vh;overflow-y:auto;
    padding:24px 26px;box-shadow:0 20px 60px rgba(0,0,0,.25);
  }
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .modal-head h3{margin:0;font-size:20px;}
  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    background:var(--grey-dark);color:var(--champagne-pale);padding:11px 20px;border-radius:9px;
    font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:80;opacity:0;pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}
  .muted{color:var(--grey-soft);}
  .badge-count{background:var(--fuschia-tint);color:var(--fuschia-deep);font-size:11px;padding:1px 7px;border-radius:999px;margin-left:auto;}
  .detail-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--grey-line);font-size:14px;}
  .detail-row:last-child{border-bottom:none;}
  .detail-row .k{color:var(--grey-soft);}
  .progress-track{width:92px;height:6px;border-radius:999px;background:var(--grey-line);overflow:hidden;}
  .progress-fill{height:100%;border-radius:999px;background:var(--fuschia);transition:width .2s ease;}
  .progress-fill.is-batal{background:var(--danger);}
  .progress-fill.is-selesai{background:var(--ok);}
  .progress-label{font-size:10.5px;color:var(--grey-soft);margin-top:3px;}
  @media(max-width:800px){
    .admin-shell{display:block;}
    .mobile-topbar{
      display:flex;align-items:center;gap:12px;position:fixed;top:0;left:0;right:0;height:58px;
      background:var(--champagne);border-bottom:1px solid var(--champagne-deep);padding:0 16px;z-index:60;
    }
    .mobile-menu-btn{
      width:38px;height:38px;border-radius:9px;border:1px solid var(--champagne-deep);background:var(--white);
      font-size:17px;color:var(--grey-dark);display:flex;align-items:center;justify-content:center;flex:none;
    }
    .mobile-topbar-brand{display:flex;align-items:center;gap:8px;min-width:0;}
    .mobile-topbar-brand img{width:30px;height:30px;object-fit:contain;flex:none;}
    .mobile-topbar-brand span{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:17px;color:var(--grey-dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .menu-toggle{display:none;}
    .sidebar-backdrop{
      display:block;position:fixed;inset:0;background:rgba(51,47,42,.45);z-index:65;
    }
    .sidebar{
      position:fixed;top:0;left:0;bottom:0;width:82vw;max-width:280px;
      z-index:70;box-shadow:0 12px 40px rgba(0,0,0,.28);
      animation:slideInSidebar .18s ease;
    }
    .sidebar-brand{margin-bottom:22px;}
    .nav-item{flex:none;white-space:normal;text-align:left;}
    .sidebar-foot{margin-top:auto;margin-left:0;padding-top:14px;padding-left:0;border-top:1px solid var(--champagne-deep);border-left:none;}
    .main{padding:20px 16px 50px;padding-top:76px;}
    .main.no-sidebar{padding-top:76px;}
  }
  @keyframes slideInSidebar{ from{transform:translateX(-100%);} to{transform:translateX(0);} }

  /* ---------- INVOICE ---------- */
  .inv-scroll{overflow:auto;background:#EFEBE1;padding:16px;border-radius:12px;border:1px solid var(--grey-line);}
  .inv-sheet{
    width:794px;min-height:1123px;background:#fff;color:#141414;
    padding:40px 74px 54px;box-sizing:border-box;margin:0 auto;
    font-family:'Jost',sans-serif;display:flex;flex-direction:column;
    box-shadow:0 6px 24px rgba(0,0,0,.14);
  }
  .inv-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:52px;}
  .inv-logo{width:215px;margin-left:-36px;display:block;}
  .inv-word{font-family:'Playfair Display',serif;font-weight:500;font-size:60px;line-height:1;letter-spacing:.5px;color:#0d0d0d;margin-top:18px;}
  .inv-meta{display:flex;justify-content:space-between;gap:30px;margin-bottom:42px;}
  .inv-billed .lbl{font-weight:600;font-size:16.5px;margin-bottom:10px;color:#111;}
  .inv-billed .lines{font-size:17px;line-height:1.6;white-space:pre-line;}
  .inv-no{text-align:right;font-size:17px;line-height:1.65;}
  .inv-table{width:100%;border-collapse:collapse;font-size:15px;}
  .inv-table th{font-weight:600;font-size:14.5px;color:#111;border-bottom:1px solid #d5d5d5;padding:0 0 11px;text-align:left;}
  .inv-table td{border-bottom:1px solid #e8e8e8;padding:14px 0;vertical-align:middle;white-space:pre-line;line-height:1.5;}
  .inv-table .qty{text-align:center;width:112px;}
  .inv-table .up{text-align:right;width:128px;}
  .inv-table .tot{text-align:right;width:132px;}
  .inv-sum{margin:26px 0 0 auto;width:42%;}
  .inv-sum-row{display:flex;justify-content:space-between;padding:12px 14px;font-size:16.5px;font-weight:600;}
  .inv-sum-row.hl{background:#F2F0EB;}
  .inv-note{margin-top:22px;font-size:14px;color:#555;white-space:pre-line;max-width:60%;}
  .inv-thanks{font-size:40px;font-weight:300;margin-top:58px;color:#111;}
  .inv-foot{margin-top:auto;padding-top:56px;display:flex;justify-content:space-between;gap:24px;align-items:flex-end;}
  .inv-pay .t{font-weight:600;font-size:15.5px;margin-bottom:9px;}
  .inv-pay .l{font-size:15.5px;line-height:1.6;}
  .inv-brand{text-align:right;}
  .inv-brand .nm{font-family:'Comfortaa',cursive;font-size:26px;color:#111;margin-bottom:6px;}
  .inv-brand .l{font-size:15.5px;line-height:1.65;}

  .inv-modal{background:transparent;max-width:none;width:auto;padding:0;box-shadow:none;}
  .inv-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:14px;}
  .inv-row{display:grid;grid-template-columns:1fr 80px 130px 120px 76px;gap:10px;align-items:start;
    background:var(--champagne-pale);padding:10px;border-radius:10px;border:1px solid var(--grey-line);margin-bottom:10px;}
  .inv-row textarea{width:100%;padding:8px 10px;border:1px solid var(--grey-line);border-radius:8px;font-size:14px;resize:vertical;}
  .inv-row input{width:100%;padding:8px 10px;border:1px solid var(--grey-line);border-radius:8px;font-size:14px;}
  .inv-row .cell-lbl{font-size:11px;color:var(--grey-soft);display:block;margin-bottom:4px;}
  .inv-row .rowtot{font-size:14px;font-weight:500;padding-top:22px;}
  @media(max-width:760px){ .inv-row{grid-template-columns:1fr 1fr;} }

  .inv-table tr.sub td{padding-top:3px;padding-bottom:13px;font-size:14px;color:#3d3d3d;}
  .inv-table td.sub-desc{padding-left:22px;}
  .inv-table tr.nb td{border-bottom:none;padding-bottom:3px;}
  .inv-total-row{display:flex;justify-content:space-between;padding:13px 14px;font-size:17px;font-weight:600;background:#F2F0EB;}
  .inv-sec-title{font-weight:600;font-size:15px;margin:26px 0 8px;}
  .inv-sec-list{font-size:15px;line-height:1.7;}
  /* ---------- lembar order (desain terpisah dari invoice) ---------- */
  .ord-sheet{
    width:794px;min-height:1123px;background:#fff;color:var(--grey-dark);margin:0 auto;
    font-family:'Jost',sans-serif;display:flex;flex-direction:column;box-sizing:border-box;
    box-shadow:0 6px 24px rgba(0,0,0,.14);
  }
  .ord-band{background:var(--champagne);padding:26px 54px;display:flex;align-items:center;justify-content:space-between;
    border-bottom:3px solid var(--fuschia);}
  .ord-band .ord-logo-box{padding:10px 16px;}
  .ord-band img{width:128px;display:block;}
  .ord-band .kick{font-size:12px;letter-spacing:3.5px;color:var(--fuschia-deep);text-align:right;}
  .ord-band .ttl{font-family:'Cormorant Garamond',serif;font-size:34px;font-weight:600;line-height:1.1;text-align:right;color:var(--grey-dark);}
  .ord-band .no{font-size:13.5px;color:var(--grey);text-align:right;margin-top:3px;}
  .ord-body{padding:30px 54px 34px;flex:1;display:flex;flex-direction:column;}
  .ord-grid{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;margin-bottom:26px;}
  .ord-box{border:1px solid var(--grey-line);border-radius:12px;padding:15px 17px;background:var(--champagne-pale);}
  .ord-box .cap{font-size:11px;letter-spacing:2px;color:var(--fuschia-deep);margin-bottom:8px;}
  .ord-box .big{font-size:19px;font-weight:600;font-family:'Cormorant Garamond',serif;margin-bottom:3px;}
  .ord-box .ln{font-size:13.5px;line-height:1.6;color:var(--grey);}
  .ord-kv{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:3px 0;color:var(--grey);}
  .ord-kv strong{color:var(--grey-dark);font-weight:500;}
  .ord-h{font-family:'Cormorant Garamond',serif;font-size:21px;font-weight:600;margin:0 0 10px;}
  .ord-table{width:100%;border-collapse:collapse;font-size:13.8px;}
  .ord-table th{background:var(--fuschia-deep);color:#fff;font-weight:500;font-size:12px;letter-spacing:.6px;
    padding:10px 12px;text-align:left;}
  .ord-table th:first-child{border-radius:9px 0 0 0;}
  .ord-table th:last-child{border-radius:0 9px 0 0;}
  .ord-table td{padding:11px 12px;border-bottom:1px solid var(--grey-line);vertical-align:middle;}
  .ord-table tr.grp td{border-bottom:none;padding-bottom:2px;}
  .ord-table tr.ad td{padding-top:2px;padding-bottom:9px;color:var(--grey);font-size:13px;}
  .ord-table td.ad-name{padding-left:30px;position:relative;}
  .ord-table td.ad-name:before{content:'↳';position:absolute;left:14px;color:var(--fuschia);}
  .ord-table .c{text-align:center;width:90px;}
  .ord-table .r{text-align:right;width:125px;}
  .ord-item-name{font-weight:500;}
  .ord-chips{display:flex;flex-wrap:wrap;gap:7px;}
  .ord-chip{background:var(--fuschia-tint);color:var(--fuschia-deep);font-size:12.5px;padding:5px 13px;border-radius:999px;}
  .ord-note{border-left:3px solid var(--champagne-deep);background:var(--champagne-pale);padding:11px 15px;
    font-size:13.5px;line-height:1.6;border-radius:0 9px 9px 0;white-space:pre-line;}
  .ord-total{margin-top:20px;margin-left:auto;width:54%;border:1px solid var(--fuschia-tint);border-radius:12px;overflow:hidden;}
  .ord-total .tr{display:flex;justify-content:space-between;padding:10px 16px;font-size:14px;color:var(--grey);}
  .ord-total .tr.main{background:var(--fuschia);color:#fff;font-size:17px;font-weight:600;}
  .ord-sign{display:grid;grid-template-columns:1fr 1fr;gap:60px;margin-top:38px;}
  .ord-sign div{text-align:center;font-size:13px;color:var(--grey);}
  .ord-sign .line{border-top:1px solid var(--grey-line);margin-top:56px;padding-top:7px;}
  .ord-status{display:inline-block;padding:4px 13px;border-radius:999px;font-size:12.5px;font-weight:500;
    background:var(--fuschia-tint);color:var(--fuschia-deep);}
  .ord-foot{background:var(--champagne-pale);border-top:1px solid var(--grey-line);padding:16px 54px;
    display:flex;justify-content:space-between;align-items:center;gap:16px;font-size:12.8px;color:var(--grey-soft);}
  .ord-foot .bn{font-family:'Comfortaa',cursive;font-size:16px;color:var(--fuschia-deep);}
  #printRoot{display:none;}
  @media print{
    @page{size:A4;margin:0;}
    body{background:#fff;}
    body > *{display:none !important;}
    body > #printRoot{display:block !important;}
    #printRoot .inv-sheet{box-shadow:none;margin:0;width:794px;min-height:1122px;}
  }

</style>
</head>

function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9); }
function rupiah(n){ n = Number(n)||0; return 'Rp' + n.toLocaleString('id-ID'); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtDate(iso){
  if(!iso) return '-';
  const d = new Date(iso+'T00:00:00');
  if(isNaN(d)) return iso;
  return d.toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'});
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

async function loadAll(){
  return new Promise((resolve)=>{
    for(const key in STORE_KEYS){
      const docId = STORE_KEYS[key];
      fsdb.collection(FS_COLLECTION).doc(docId).onSnapshot((doc)=>{
        if(doc.exists){
          const data = doc.data();
          DB[key] = (data && 'value' in data) ? data.value : (key==='settings' ? {} : []);
        } else {
          DB[key] = (key==='settings' ? {} : []);
        }
        if(key==='settings') normalizeSettings();

        if(!loaded){
          fsInitialLoadCount++;
          if(fsInitialLoadCount >= FS_TOTAL_KEYS){
            finishInitialLoad();
            resolve();
          }
        } else {
          // update realtime setelah load awal selesai
          render();
        }
      }, (err)=>{
        console.error('Firestore sync error ('+key+'):', err);
        showToast('Gagal sinkronisasi data. Cek koneksi/konfigurasi Firebase.');
        if(!loaded){
          fsInitialLoadCount++;
          if(fsInitialLoadCount >= FS_TOTAL_KEYS){
            finishInitialLoad();
            resolve();
          }
        }
      });
    }
  });
}

async function finishInitialLoad(){
  normalizeSettings();
  if(!DB.settings.seeded && DB.categories.length===0 && DB.products.length===0){
    seedData();
    DB.settings.seeded = true;
    await saveKey('categories');
    await saveKey('products');
    await saveKey('bonus');
    await saveKey('addons');
    await saveKey('settings');
  } else if(!DB.settings.seeded){
    // sudah ada data (misal migrasi lama) tapi belum ditandai -> tandai saja tanpa seed ulang
    DB.settings.seeded = true;
    await saveKey('settings');
  }
  loaded = true;
}

async function saveKey(key){
  try{
    await fsdb.collection(FS_COLLECTION).doc(STORE_KEYS[key]).set({ value: DB[key] });
    // Tidak perlu render() manual di sini — onSnapshot akan otomatis
    // memicu render begitu Firestore mengonfirmasi perubahan (baik di
    // perangkat ini maupun perangkat lain).
  }catch(e){
    showToast('Gagal menyimpan data. Coba lagi.');
    console.error(e);
  }
}

function renderContactCard(){
  const s = DB.settings || {};
  if(!s.phone && !s.instagram && !s.address) return '';
  return `
  <div class="contact-card">
    ${s.phone? `<div class="contact-item"><span class="ic">📞</span><span><span class="k">Telepon</span>${escapeHtml(s.phone)}</span></div>`:''}

function renderProductCard(p){
  const cat = DB.categories.find(c=>c.id===p.categoryId);
  const thumb = p.image ? `<img src="${escapeAttr(p.image)}" alt="">` : (p.name||'?').charAt(0).toUpperCase();

    const a = DB.addons.find(a=>a.id===pa.id);
    return a ? {name:a.name, price:pa.price} : null;
  }).filter(Boolean);
  return `
  <div class="product-card">
    <div class="product-thumb">${thumb}${cat? `<span class="product-cat-badge">${escapeHtml(cat.name)}</span>`:''}</div>
    <div class="product-info">

function copyClientLink(){

function fallbackCopyClientLink(link){
  try{

    if(input){ input.select(); document.execCommand('copy'); showToast('Link klien disalin!'); return; }
  }catch(e){}
  showToast('Gagal menyalin otomatis. Salin manual: '+link);

function statusPill(s){
  const map = {'Baru':'pill-baru','Diproses':'pill-diproses','Selesai':'pill-selesai','Dibatalkan':'pill-batal'};
  return `<span class="pill ${map[s]||'pill-baru'}">${s}</span>`;

  DB.categories = DB.categories.filter(c=>c.id!==id);
  saveKey('categories'); showToast('Kategori dihapus.'); render();

  const i = pendingProductAddons.findIndex(pa=>pa.id===id);
  if(i>-1) pendingProductAddons.splice(i,1);
  else pendingProductAddons.push({id, price:Number(defaultPrice)||0});
  render();
}

  const pa = pendingProductAddons.find(pa=>pa.id===id);
  if(pa) pa.price = Number(price)||0;

function updateProdImagePreview(){
  const editData = editing.type==='produk' ? DB.products.find(p=>p.id===editing.id) : null;

}
function compressImageFile(file, maxDim, quality){
  maxDim = maxDim || 600; quality = quality || 0.72;
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > maxDim || h > maxDim){
          if(w > h){ h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function handleProdImageUpload(event){
  const file = event.target.files && event.target.files[0];
  if(!file) return;
  try{
    const dataUrl = await compressImageFile(file, 700, 0.75);
    pendingProductImage = dataUrl;
    const urlField = document.getElementById('prodImage');
    if(urlField) urlField.value = '';
    updateProdImagePreview();
  }catch(e){
    showToast('Gagal memproses gambar. Coba file lain.');
  }
}

    <div class="total-line"><span>Jumlah item</span><span>${d.items.reduce((s,i)=>s+i.qty,0)} pcs</span></div>
    <div class="total-line"><span>Bonus dipilih</span><span>${d.bonusIds.length} item</span></div>
    <div class="total-line grand"><span>Total</span><span>${rupiah(total)}</span></div>
    <button class="btn btn-fuschia" onclick="submitOrder()">${editingOrderId?'Update Order':'Simpan Order'}</button>
    <button class="btn btn-outline" style="margin-left:8px;" onclick="${editingOrderId?'cancelEditOrder()':'initOrderDraft(); render();'}">${editingOrderId?'Batal Edit':'Reset Form'}</button>
  </div>`;
}
function setOrderClientMode(m){ orderDraft.clientMode=m; render(); }
function addOrderItem(){
  const p = DB.products.find(p=>p.id===orderDraft.pickProduct);
  if(!p){ showToast('Pilih produk terlebih dahulu.'); return; }
  const addonIds = orderDraft.pickAddonIds.slice();
  const addons = addonIds.map(id=>{
    const pa = (p.addons||[]).find(pa=>pa.id===id);
    const a = DB.addons.find(a=>a.id===id);
    return (pa && a) ? {id:a.id,name:a.name,price:pa.price} : null;
  }).filter(Boolean);
  const addonTotal = addons.reduce((s,a)=>s+a.price,0);
  const unitTotal = p.price + addonTotal;
  const addonKey = addonIds.slice().sort().join(',');
  const existing = orderDraft.items.find(i=>i.productId===p.id && (i.addonIds||[]).slice().sort().join(',')===addonKey);
  if(existing){ existing.qty += orderDraft.pickQty; }
  else{ orderDraft.items.push({productId:p.id, name:p.name, price:p.price, addonIds, addons, unitTotal, qty:orderDraft.pickQty}); }
  orderDraft.pickQty = 1;
  orderDraft.pickAddonIds = [];
  render();
}
function toggleOrderPickAddon(id){
  const i = orderDraft.pickAddonIds.indexOf(id);
  if(i>-1) orderDraft.pickAddonIds.splice(i,1); else orderDraft.pickAddonIds.push(id);
  render();
}
function removeOrderItem(idx){ orderDraft.items.splice(idx,1); render(); }
function toggleOrderBonus(id){
  const i = orderDraft.bonusIds.indexOf(id);
  if(i>-1) orderDraft.bonusIds.splice(i,1); else orderDraft.bonusIds.push(id);
  render();
}
function submitOrder(){
  const d = orderDraft;
  if(d.items.length===0){ showToast('Tambahkan minimal 1 item pesanan.'); return; }
  let clientId, clientSnap;
  if(d.clientMode==='existing'){
    const c = DB.clients.find(c=>c.id===d.clientId);
    if(!c){ showToast('Pilih klien terlebih dahulu.'); return; }
    clientId=c.id; clientSnap={name:c.name,phone:c.phone,address:c.address};
  }else{
    if(!d.newClient.name.trim()){ showToast('Nama klien baru wajib diisi.'); return; }
    const newC = {id:uid('cl'), name:d.newClient.name.trim(), phone:d.newClient.phone.trim(), address:d.newClient.address.trim(), notes:''};
    DB.clients.push(newC); saveKey('clients');
    clientId=newC.id; clientSnap={name:newC.name,phone:newC.phone,address:newC.address};
  }
  const total = d.items.reduce((s,i)=>s+(i.unitTotal!=null?i.unitTotal:i.price)*i.qty,0);

  if(editingOrderId){
    const existing = DB.orders.find(o=>o.id===editingOrderId);
    if(!existing){
      showToast('Order tidak ditemukan.');
      editingOrderId=null; initOrderDraft(); adminTab='daftarorder'; render();
      return;
    }
    existing.clientId = clientId;
    existing.clientSnapshot = clientSnap;
    existing.orderDate = d.orderDate || todayISO();
    existing.eventDate = d.eventDate;
    existing.items = d.items;
    existing.bonusIds = d.bonusIds.slice();
    existing.notes = d.notes;
    existing.total = total;
    saveKey('orders');
    editingOrderId = null;
    initOrderDraft();
    adminTab='daftarorder';
    showToast('Order berhasil diperbarui.');
    render();
    return;
  }

  const order = {
    id: uid('ord'),
    clientId, clientSnapshot: clientSnap,
    orderDate: d.orderDate || todayISO(),
    eventDate: d.eventDate,
    items: d.items,
    bonusIds: d.bonusIds.slice(),
    notes: d.notes,
    status: 'Baru',
    total
  };
  DB.orders.push(order);
  saveKey('orders');
  initOrderDraft();
  adminTab='daftarorder';
  showToast('Order berhasil disimpan.');
  render();
}
function editOrder(id){
  const o = DB.orders.find(o=>o.id===id);
  if(!o) return;
  const clientStillExists = DB.clients.some(c=>c.id===o.clientId);
  orderDraft = {
    clientMode: clientStillExists ? 'existing' : 'new',
    clientId: clientStillExists ? o.clientId : (DB.clients[0] ? DB.clients[0].id : ''),
    newClient: clientStillExists
      ? {name:'', phone:'', address:'', notes:''}
      : {name:o.clientSnapshot.name||'', phone:o.clientSnapshot.phone||'', address:o.clientSnapshot.address||'', notes:''},
    orderDate: o.orderDate || todayISO(),
    eventDate: o.eventDate || '',
    items: o.items.map(it=>({
      productId: it.productId, name: it.name, price: it.price,
      addonIds: (it.addonIds||[]).slice(),
      addons: (it.addons||[]).map(a=>({...a})),
      unitTotal: it.unitTotal,
      qty: it.qty
    })),
    bonusIds: o.bonusIds.slice(),
    notes: o.notes || '',
    pickCategory: DB.categories[0] ? DB.categories[0].id : '',
    pickProduct: '',
    pickQty: 1,
    pickAddonIds: []
  };
  editingOrderId = id;
  editing = {type:null, id:null};
  adminTab = 'buatorder';
  render();
}
function cancelEditOrder(){
  editingOrderId = null;
  initOrderDraft();
  adminTab = 'daftarorder';
  render();
}

/* ============================================================
   INVOICE — penomoran otomatis, kalkulasi, PDF
   ============================================================ */
let invoiceDraft = null;
let editingInvoiceId = null;

const ROMAN = ['','I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'];
const BULAN_ID = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];

function fmtNum(n){ return (Number(n)||0).toLocaleString('id-ID'); }
function fmtTanggalPanjang(iso){
  if(!iso) return '';
  const d = new Date(iso+'T00:00:00');
  if(isNaN(d)) return iso;
  return d.getDate()+' '+BULAN_ID[d.getMonth()]+' '+d.getFullYear();
}
function buatNomorInvoice(seq, iso, prefix){
  const d = new Date((iso||todayISO())+'T00:00:00');
  const bulan = isNaN(d) ? 1 : d.getMonth()+1;
  const tahun = isNaN(d) ? new Date().getFullYear() : d.getFullYear();
  return `${seq}/${prefix||'YSS'}/${ROMAN[bulan]}/${tahun}`;
}
function nextSeq(){ return Math.max(1, Number(DB.settings.nextInvoiceSeq)||53); }

/* ---------- draft ---------- */
function initInvoiceDraft(orderId){
  const o = orderId ? DB.orders.find(x=>x.id===orderId) : null;
  let billed = [], items = [];
  if(o){
    const c = o.clientSnapshot || {};
    if(c.name) billed.push(c.name);
    if(c.address) billed.push(c.address);
    if(o.eventDate) billed.push('Event '+fmtTanggalPanjang(o.eventDate));
    o.items.forEach(it=>{
      const addons = it.addons||[];
      items.push({desc: it.name, qty: it.qty, price: (it.price!=null?it.price:0), free:false, sub:false});
      addons.forEach(a=>{
        items.push({desc:'Add-on: '+a.name, qty: it.qty, price: a.price, free:false, sub:true});
      });
    });
    (o.bonusIds||[]).forEach(id=>{
      const b = DB.bonus.find(b=>b.id===id);
      if(b) items.push({desc:b.name+' (free)', qty:1, price:0, free:true, sub:false});
    });
  }
  invoiceDraft = {
    orderId: o ? o.id : '',
    seq: nextSeq(),
    date: todayISO(),
    billed: billed.join('\n'),
    phone: o ? teleponKlien(o) : '',
    items: items.length ? items : [{desc:'', qty:1, price:0, free:false, sub:false}],
    dpPercent: Number(DB.settings.dpDefault)||50,
    showSisa: false,
    note: ''
  };
  editingInvoiceId = null;
}
function teleponKlien(o){
  const snap = o.clientSnapshot || {};
  if(snap.phone) return snap.phone;
  const c = DB.clients.find(x=>x.id===o.clientId);
  return c ? (c.phone||'') : '';
}
function isiDariKlien(id){
  const c = DB.clients.find(x=>x.id===id);
  if(!c || !invoiceDraft) return;
  const lines = [c.name];
  if(c.address) lines.push(c.address);
  invoiceDraft.billed = lines.join('\n');
  invoiceDraft.phone = c.phone||'';
  render();
  showToast('Data klien dimuat.');
}
function buatInvoice(orderId){
  initInvoiceDraft(orderId);
  adminTab = 'invoice';
  editing = {type:null, id:null};
  render();
  showToast('Invoice disiapkan dari data order.');
}
function hitungInvoice(inv){
  const subtotal = inv.items.reduce((s,i)=> s + (i.free ? 0 : (Number(i.qty)||0)*(Number(i.price)||0)), 0);
  const dp = Math.round(subtotal * (Number(inv.dpPercent)||0) / 100);
  return {subtotal, dp, sisa: subtotal - dp};
}

  if(cell) cell.innerHTML = it.free ? '<span class="muted">gratis</span>' : fmtNum(it.qty*it.price);

}

function batalInvoice(){ invoiceDraft=null; editingInvoiceId=null; render(); }

function simpanInvoice(){
  const d = invoiceDraft;
  const isi = d.items.filter(i=>String(i.desc||'').trim()!=='');
  if(!isi.length){ showToast('Isi minimal satu item.'); return; }
  if(!String(d.billed||'').trim()){ showToast('Isi nama klien di bagian Billed To.'); return; }
  const data = {
    no: buatNomorInvoice(d.seq, d.date, DB.settings.invPrefix),
    seq: d.seq, date: d.date, orderId: d.orderId,
    billed: d.billed, phone: d.phone||'', items: isi.map(i=>({...i})),
    dpPercent: d.dpPercent, showSisa: d.showSisa, note: d.note
  };
  if(editingInvoiceId){
    const inv = DB.invoices.find(x=>x.id===editingInvoiceId);
    Object.assign(inv, data);
    showToast('Invoice diperbarui.');
  }else{
    data.id = uid('inv');
    DB.invoices.push(data);
    DB.settings.nextInvoiceSeq = Math.max(nextSeq(), d.seq+1);
    saveKey('settings');
    showToast('Invoice '+data.no+' tersimpan.');
  }
  saveKey('invoices');
  const id = editingInvoiceId || data.id;
  invoiceDraft = null; editingInvoiceId = null;
  render();
  lihatInvoice(id);
}
function editInvoice(id){
  const inv = DB.invoices.find(x=>x.id===id); if(!inv) return;
  invoiceDraft = {
    orderId: inv.orderId||'', seq: inv.seq, date: inv.date,
    billed: inv.billed, phone: inv.phone||'', items: inv.items.map(i=>({...i})),
    dpPercent: inv.dpPercent, showSisa: !!inv.showSisa, note: inv.note||''
  };
  editingInvoiceId = id;
  adminTab = 'invoice';
  render();
}
function hapusInvoice(id){
  if(!confirm('Hapus invoice ini?')) return;
  DB.invoices = DB.invoices.filter(x=>x.id!==id);
  saveKey('invoices'); showToast('Invoice dihapus.'); render();
}

/* ---------- WhatsApp ---------- */
function normalisasiWa(no){
  let n = String(no||'').replace(/[^0-9]/g,'');
  if(!n) return '';
  if(n.startsWith('0')) n = '62' + n.slice(1);
  else if(n.startsWith('8')) n = '62' + n;
  else if(n.startsWith('620')) n = '62' + n.slice(3);
  return n;
}
function bukaWa(no, pesan){
  const n = normalisasiWa(no);
  if(!n){ showToast('Nomor WhatsApp klien belum diisi.'); return; }
  const url = 'https://wa.me/' + n + '?text=' + encodeURIComponent(pesan);
  const w = window.open(url, '_blank');
  if(!w){ showToast('Popup diblokir. Izinkan popup lalu coba lagi.'); return; }
  showToast('WhatsApp dibuka. Lampirkan file PDF-nya ya.');
}

/* ---------- PDF & print ---------- */
function muatHtml2Pdf(){
  return new Promise((resolve, reject)=>{
    if(window.html2pdf) return resolve();
    const urls = [
      'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js',
      'https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js',
      'https://unpkg.com/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js'
    ];
    let i = 0;
    const coba = ()=>{
      if(i>=urls.length) return reject(new Error('gagal memuat'));
      const s = document.createElement('script');
      s.src = urls[i++];
      s.onload = ()=> window.html2pdf ? resolve() : coba();
      s.onerror = coba;
      document.head.appendChild(s);
    };
    coba();
  });
}
async function unduhSheetPdf(elId, filename, fallback){
  const el = document.getElementById(elId);
  if(!el){ showToast('Buka pratinjau dulu.'); return; }
  showToast('Menyiapkan PDF...');
  try{
    await muatHtml2Pdf();
    await html2pdf().set({
      margin: 0,
      filename: filename,
      image: {type:'jpeg', quality:0.98},
      html2canvas: {scale:2, useCORS:true, backgroundColor:'#ffffff', windowWidth:794},
      jsPDF: {unit:'px', format:[794, Math.max(1123, el.scrollHeight)], orientation:'portrait', hotfixes:['px_scaling']}
    }).from(el).save();
    showToast('PDF selesai diunduh.');
  }catch(e){
    console.error(e);
    showToast('Unduh otomatis gagal — dibuka lewat Print, pilih "Save as PDF".');
    if(fallback) fallback();
  }
}
function cetakSheetHtml(html){
  const root = document.getElementById('printRoot');
  root.innerHTML = html.replace(/id="(invSheet|orderSheet)"/, 'id="$1Print"');
  setTimeout(()=>{ window.print(); }, 150);
}
function bukaTabSheetHtml(html, title){
  const css = (document.querySelector('style')||{}).textContent||'';
  const doc = '<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><title>'+title+'</title>'
    + '<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500&family=Jost:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">'
    + '<style>'+css+' body{background:#fff;margin:0;} .inv-sheet{box-shadow:none;} @media print{ body > *{display:block !important;} @page{size:A4;margin:0;} }</style>'
    + '</head><body>'+html
    + '<scr'+'ipt>window.onload=function(){setTimeout(function(){window.print();},700);};</scr'+'ipt>'
    + '</body></html>';
  const w = window.open('', '_blank');
  if(!w){ showToast('Popup diblokir browser. Pakai tombol Print.'); return; }
  w.document.open(); w.document.write(doc); w.document.close();
}

/* ============================================================

   ============================================================ */
function escapeHtml(str){
  return String(str??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(str){ return escapeHtml(str); }
